# JVM args for the Gradle daemon. 2g is enough for this scaffold and keeps the gate within
# a modest CI runner's memory.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is mandatory for Compose/WorkManager; the support library is retired.
android.useAndroidX=true

# Non-transitive R classes: each module gets only its own resources, smaller and faster.
android.nonTransitiveRClass=true

kotlin.code.style=official

# Configuration cache + parallel build — deterministic and faster on reruns.
org.gradle.caching=true
org.gradle.parallel=true
