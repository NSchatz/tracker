# Version catalog — the single source of truth for the Android toolchain and dependency
# pins. AGP 8.5.2 is the version the umbrella's C0 toolchain probe proved builds end-to-end
# in the container (roadmap §C0 "Toolchain"); it requires JDK 17 and pairs with the Kotlin /
# Compose-compiler versions below.
[versions]
agp = "8.5.2"
kotlin = "1.9.24"
# Compose compiler extension MUST track the Kotlin version (1.9.24 → 1.5.14). A mismatch is
# a hard build failure, not a warning.
composeCompiler = "1.5.14"
composeBom = "2024.06.00"
coreKtx = "1.13.1"
lifecycle = "2.8.3"
activityCompose = "1.9.0"
workManager = "2.9.0"
material = "1.12.0"
# FusedLocationProviderClient and the LocationRequest builder used by C1's foreground service. This
# is Google Play services, not AOSP: it is the fused provider (GPS + wifi + cell + sensors, with the
# batching and power management that makes continuous collection survivable on a battery), and there
# is no AOSP equivalent. It is also the one dependency that ties the client to a Play-services
# device — a fully degoogled phone would need a LocationManager path, which is not built here and is
# noted as a limitation in android/README.md.
playServicesLocation = "21.3.0"
junit = "4.13.2"
# The INSTRUMENTED half of the UI gate (S0056). F2 of the umbrella's frontend conventions admits
# exactly one Android grader for a claim about what a person sees: an emulator, not the JVM. So
# these are androidTest-only dependencies that run on a booted device.
androidxTestCore = "1.6.1"
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
androidxTestExtJunit = "1.2.1"
androidxTestUiAutomator = "2.3.0"
# Google's Accessibility Test Framework: the same checks the platform's own Accessibility Scanner
# runs (contrast, touch target size, spoken name), applied to the real AccessibilityNodeInfo tree
# the emulator produced. Compose exposes a full semantics tree through that interface, so this
# grades what a screen reader would actually be handed.
accessibilityTestFramework = "4.1.1"
# ATF's public API returns Guava collections, so the test classpath needs Guava to name them.
# androidTest-only; it never reaches the shipped APK.
guava = "33.2.1-android"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# WorkManager — the C2 offline-durable report queue runs on this: `queue/FixUploadWorker`
# flushes the on-disk fix queue under a `NetworkType.CONNECTED` constraint.
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
# Supplies the Activity window's XML theme (Theme.Material3.*) shown before Compose's first
# frame. The in-app surface itself is Compose Material3.
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-core = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "androidxTestExtJunit" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "androidxTestUiAutomator" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
accessibility-test-framework = { group = "com.google.android.apps.common.testing.accessibility.framework", name = "accessibility-test-framework", version.ref = "accessibilityTestFramework" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
