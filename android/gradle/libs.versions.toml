# Version catalog — the single source of truth for the Android toolchain and dependency
# pins. AGP 8.5.2 is the version the umbrella's C0 toolchain probe proved builds end-to-end
# in the container (roadmap §C0 "Toolchain"); it requires JDK 17 and pairs with the Kotlin /
# Compose-compiler versions below.
[versions]
agp = "8.5.2"
kotlin = "1.9.24"
# Compose compiler extension MUST track the Kotlin version (1.9.24 → 1.5.14). A mismatch is
# a hard build failure, not a warning.
composeCompiler = "1.5.14"
composeBom = "2024.06.00"
coreKtx = "1.13.1"
lifecycle = "2.8.3"
activityCompose = "1.9.0"
workManager = "2.9.0"
material = "1.12.0"
# FusedLocationProviderClient and the LocationRequest builder used by C1's foreground service. This
# is Google Play services, not AOSP: it is the fused provider (GPS + wifi + cell + sensors, with the
# batching and power management that makes continuous collection survivable on a battery), and there
# is no AOSP equivalent. It is also the one dependency that ties the client to a Play-services
# device — a fully degoogled phone would need a LocationManager path, which is not built here and is
# noted as a limitation in android/README.md.
playServicesLocation = "21.3.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# WorkManager — the C2 offline-durable report queue runs on this: `queue/FixUploadWorker`
# flushes the on-disk fix queue under a `NetworkType.CONNECTED` constraint.
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
# Supplies the Activity window's XML theme (Theme.Material3.*) shown before Compose's first
# frame. The in-app surface itself is Compose Material3.
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
