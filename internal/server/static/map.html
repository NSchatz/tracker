<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tracker - live map</title>

  <!-- Leaflet is VENDORED and served by tracker itself (/static), never a third-party CDN. For a
       self-hosted privacy product that matters: loading the map's script from someone else's server
       would tell them who is watching the family's location. The one thing still fetched from a third
       party is the map TILES (OpenStreetMap, below) - device markers render and move with or without
       them, and the in-app map (roadmap C5) removes even that. This page is the interim viewer. -->
  <link rel="stylesheet" href="/static/leaflet.css">
  <script nonce="__CSP_NONCE__" src="/static/leaflet.js"></script>

  <style nonce="__CSP_NONCE__">
    /* Two themes, both authored. `color-scheme` alone only re-paints UA widgets; every colour this
       page decides is declared here, once per theme, so that "follow the operating system" is a
       thing the engine can be asked about rather than a thing the stylesheet merely implies.
       Every pair below clears WCAG 2.2 AA against the surface it is actually painted on: 4.5:1 for
       text, 3:1 for control boundaries, focus rings and state marks. */
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --surface: #f2f2f2;
      --fg: #14181f;
      --muted: #4d5359;
      --live: #0a6b3d;
      --error: #a4111a;
      --warn: #6b4e00;
      --link: #0b4fa8;
      --border: #6b7178;
      --focus: #0b4fa8;
      --map-bg: #d7dbe0;
      --control-bg: #ffffff;
      --control-fg: #14181f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12161b;
        --surface: #1c2229;
        --fg: #e9edf2;
        --muted: #b6bfc9;
        --live: #64dda4;
        --error: #ffb3ab;
        --warn: #f0c65a;
        --link: #8ec2ff;
        --border: #8b959f;
        --focus: #8ec2ff;
        --map-bg: #232a32;
        --control-bg: #1c2229;
        --control-fg: #e9edf2;
      }
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font: 15px/1.5 system-ui, sans-serif;
      background: var(--bg); color: var(--fg);
    }

    /* One focus rule for everything focusable, authored rather than inherited, so the indicator is a
       property of the page and not of whichever engine happens to render it. */
    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    .leaflet-container:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }

    #bar {
      display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;
      padding: .5rem .75rem; border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    #brand { font-size: 1rem; }
    #token-label { color: var(--fg); }
    #token {
      flex: 1 1 14rem; min-width: 7rem; min-height: 32px;
      padding: .35rem .5rem; font: inherit;
      background: var(--bg); color: var(--fg);
      border: 1px solid var(--border); border-radius: 4px;
    }
    #watch {
      min-height: 32px; min-width: 44px; padding: .35rem .8rem; font: inherit; cursor: pointer;
      background: var(--surface); color: var(--fg);
      border: 1px solid var(--border); border-radius: 4px;
    }
    #status { color: var(--muted); }
    #status[data-health="live"] { color: var(--live); }
    #status[data-health="error"] { color: var(--error); }
    /* The state a status word carries is never carried by colour alone: the word itself is the
       state, and the colour only reinforces it. */

    a.doc-link {
      color: var(--link);
      display: inline-block; min-height: 24px; min-width: 24px; line-height: 24px;
      padding: 0 4px;
    }

    #body { display: flex; height: calc(100% - 3.25rem); }
    #panel {
      width: 21rem; max-width: 45%; overflow: auto;
      border-right: 1px solid var(--border);
      padding: .5rem .75rem;
      background: var(--surface); color: var(--fg);
    }
    #panel h2, #panel h3 {
      font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
      color: var(--fg); margin: .75rem 0 .25rem;
    }
    #panel p { margin: .25rem 0; }
    #panel ul { list-style: none; margin: 0; padding: 0; }
    #panel li { padding: .25rem 0; border-bottom: 1px solid var(--border); }
    #panel li .name { font-weight: 600; }
    #panel li .state { color: var(--muted); }
    #panel li[data-state="live"] .state { color: var(--live); }
    #panel li .unconfirmed { color: var(--error); }
    #panel li .note { color: var(--warn); }
    .figure { color: var(--fg); }
    .detail { color: var(--muted); }
    #panel-state { font-weight: 600; }
    #panel-state[data-state="error"] { color: var(--error); }
    .hidden { display: none; }

    #map { flex: 1 1 auto; }
    /* Leaflet ships one light palette. Re-point its controls at the tokens above so the whole page
       answers the operating-system preference, and so every boundary on them is measurable. */
    .leaflet-container { background: var(--map-bg); }
    .leaflet-bar { border: 2px solid var(--border); box-shadow: none; }
    .leaflet-bar a, .leaflet-bar a:hover, .leaflet-bar a:focus {
      background-color: var(--control-bg); color: var(--control-fg);
      border-bottom: 1px solid var(--border);
      width: 30px; height: 30px; line-height: 30px;
    }
    .leaflet-container .leaflet-control-attribution {
      background: var(--bg); color: var(--fg); padding: 0 6px;
    }
    .leaflet-control-attribution a {
      color: var(--link);
      display: inline-block; min-height: 24px; min-width: 24px; line-height: 24px;
    }
    .leaflet-attribution-flag { display: none !important; }

    /* Phone first. Under 620px the panel stops competing with the map for width: it stacks above it,
       full width, scrolling inside itself, so the page body never scrolls sideways. */
    @media (max-width: 620px) {
      #body { flex-direction: column; height: calc(100% - 5.5rem); }
      #panel { width: 100%; max-width: 100%; max-height: 45%; border-right: 0; border-bottom: 1px solid var(--border); }
      #map { min-height: 12rem; }
    }
  </style>
</head>
<body>
  <header id="bar" data-region="controls">
    <strong id="brand">tracker</strong>
    <label for="token" id="token-label">Viewer token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false">
    <button id="watch">Watch</button>
    <p id="status" role="status" aria-live="polite" aria-label="Connection status" data-health="idle">Enter a viewer token</p>
    <a id="controls-doc" class="doc-link" href="/static/map-explained.html#watching">How watching works</a>
  </header>
  <div id="body">
    <section id="panel" data-region="devices" aria-labelledby="panel-heading">
      <h2 id="panel-heading">Devices</h2>
      <p id="panel-state" data-state="idle">Enter a viewer token</p>
      <p id="panel-action" class="detail">Then choose Watch</p>
      <p id="located-count" class="figure hidden"></p>
      <ul id="located" aria-label="Devices on the map"></ul>
      <h3 id="unlocated-heading" class="hidden">Without a position</h3>
      <ul id="unlocated" aria-label="Devices without a position"></ul>
      <p id="rejected" class="figure hidden"></p>
      <p id="rejected-detail" class="detail hidden"></p>
      <a id="devices-doc" class="doc-link" href="/static/map-explained.html#states">What these words mean</a>
    </section>
    <div id="map" aria-label="Family map"></div>
  </div>

  <script nonce="__CSP_NONCE__">
    // A live family map with no build step.
    //
    // THE ONE RULE THIS PAGE OBEYS: the SERVER decides what a device's state is, and this page renders
    // exactly the token it was sent. There is no clock arithmetic here and there must never be one - a
    // browser whose clock is hours off (or a laptop resuming from sleep) would otherwise disagree with
    // the server about whether a phone is live, and the whole point of a server-computed presentation
    // value is that every surface says the same thing.
    //
    // Two server-sent sources describe a device: GET /v1/positions (which tells us the DEVICE SET is
    // complete, so "no devices in this family" is distinguishable from "still connecting") and the SSE
    // stream. THE STREAM WINS: once the stream has described a device, a positions response that lands
    // later contributes nothing but the device's existence, so a slow response can never revert a
    // repaint the stream already made.
    //
    // Connection health is a SEPARATE AXIS from device state. A broken stream never turns a family
    // green and never freezes the last states as though they were current: the page keeps the exact
    // token the server last sent for each device and ANNOTATES it as last known and unconfirmed,
    // alongside a page-level interruption notice. No device is then presented as CURRENTLY live.

    // The complete presentation vocabulary, exactly as the wire spells it (SPEC.md). Anything else
    // arriving under a `presentation` key is an event this page refuses rather than renders.
    var STATE_TOKENS = ['no-position', 'live', 'recent', 'stale'];

    // What a reader sees for each wire token. A state must be legible without colour and without
    // knowing the protocol, so `no-position` reads as an absence in words rather than as a bare token,
    // a dash or a zero. The words stay few; the explanation lives in /static/map-explained.html.
    var STATE_TEXT = {
      'no-position': 'no position recorded',
      'live': 'live now',
      'recent': 'seen recently',
      'stale': 'not seen lately'
    };

    // The two strings a reader must be able to tell apart from "still connecting".
    var MSG_NO_DEVICES = 'no devices in this family';
    var MSG_REFUSED = 'viewer token refused';
    var MSG_UNCONFIRMED = '(last known - unconfirmed)';

    var map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var statusEl = document.getElementById('status');
    var panelStateEl = document.getElementById('panel-state');
    var panelActionEl = document.getElementById('panel-action');
    var locatedCountEl = document.getElementById('located-count');
    var rejectedEl = document.getElementById('rejected');
    var rejectedDetailEl = document.getElementById('rejected-detail');
    var locatedEl = document.getElementById('located');
    var unlocatedEl = document.getElementById('unlocated');
    var unlocatedHeadingEl = document.getElementById('unlocated-heading');
    var tokenEl = document.getElementById('token');
    var watchEl = document.getElementById('watch');

    var devices = {};           // device_id -> {id, name, state, located, note}
    var markers = {};           // device_id -> Leaflet marker (located devices only)
    var describedByStream = {}; // device_id -> true, once the stream has described it
    var source = null;          // the current EventSource
    var everOpened = false;     // has this connection ever been established?
    var interrupted = false;    // connection health, NOT device state
    var interruptedWhy = '';
    var receivedCount = 0;      // every stream event and positions entry this page was handed
    var rejectedCount = 0;      // how many of those it could not read
    var lastRejection = '';
    var deviceSetKnown = false; // has GET /v1/positions told us the set is complete?
    var fitted = false;         // have we auto-framed the first located device yet?
    var watching = false;       // has a watch attempt begun?
    var failure = '';           // the reason this attempt cannot proceed, or '' - the ERROR state
    var failureAction = '';

    function setStatus(text, health) {
      statusEl.textContent = text;
      statusEl.setAttribute('data-health', health || 'idle');
    }

    // stateText is what a viewer READS for a device state. The four stay distinguishable when colour
    // perception is removed because the distinguishing thing is the wording, never the paint - and the
    // unconfirmed annotation is added BESIDE it, never in place of it.
    function stateText(token) {
      return STATE_TEXT[token] || token;
    }

    function label(d) {
      var text = d.name + ' - ' + stateText(d.state);
      if (interrupted) { text += ' ' + MSG_UNCONFIRMED; }
      return text;
    }

    function show(el, on) {
      if (on) { el.classList.remove('hidden'); } else { el.classList.add('hidden'); }
    }

    // panelState is the ONE state this view is in. It is computed here, in one place, from one set of
    // inputs, which is what makes "never two of the three at once" a property of the page rather than
    // a coincidence of four independent `hidden` flags.
    function panelState(deviceCount) {
      if (failure) { return 'error'; }
      if (!watching) { return 'idle'; }
      if (!deviceSetKnown) { return 'loading'; }
      if (deviceCount === 0) { return 'empty'; }
      return 'ready';
    }

    function renderPanelState(deviceCount) {
      var s = panelState(deviceCount);
      panelStateEl.setAttribute('data-state', s);
      switch (s) {
        case 'error':
          panelStateEl.textContent = failure;
          panelActionEl.textContent = failureAction;
          break;
        case 'idle':
          panelStateEl.textContent = 'Enter a viewer token';
          panelActionEl.textContent = 'Then choose Watch';
          break;
        case 'loading':
          panelStateEl.textContent = 'Connecting to your family';
          panelActionEl.textContent = 'Choose Watch again to retry';
          break;
        case 'empty':
          panelStateEl.textContent = MSG_NO_DEVICES;
          panelActionEl.textContent = 'Enrol a phone to see it here';
          break;
        default:
          panelStateEl.textContent = 'Watching your family';
          panelActionEl.textContent = interrupted ? 'Feed interrupted' : 'Live from your server';
      }
      return s;
    }

    function render() {
      var ids = Object.keys(devices).sort(function (a, b) {
        var an = devices[a].name.toLowerCase(), bn = devices[b].name.toLowerCase();
        if (an !== bn) { return an < bn ? -1 : 1; }
        return a < b ? -1 : 1;
      });

      locatedEl.textContent = '';
      unlocatedEl.textContent = '';
      var unlocatedCount = 0;

      for (var i = 0; i < ids.length; i++) {
        var d = devices[ids[i]];
        var li = document.createElement('li');
        li.setAttribute('data-device-id', d.id);
        li.setAttribute('data-state', d.state);
        var nameSpan = document.createElement('span');
        nameSpan.className = 'name';
        nameSpan.textContent = d.name;
        li.appendChild(nameSpan);
        li.appendChild(document.createTextNode(' '));
        var span = document.createElement('span');
        span.className = 'state';
        span.textContent = stateText(d.state);
        li.appendChild(span);
        if (d.note) {
          li.appendChild(document.createTextNode(' '));
          var note = document.createElement('span');
          note.className = 'note';
          note.textContent = d.note;
          li.appendChild(note);
        }
        if (interrupted) {
          li.appendChild(document.createTextNode(' '));
          var mark = document.createElement('span');
          mark.className = 'unconfirmed';
          mark.textContent = MSG_UNCONFIRMED;
          li.appendChild(mark);
        }
        if (d.located) {
          locatedEl.appendChild(li);
          if (markers[d.id]) { markers[d.id].setTooltipContent(label(d)); }
        } else {
          unlocatedEl.appendChild(li);
          unlocatedCount++;
        }
      }
      show(unlocatedHeadingEl, unlocatedCount > 0);

      var locatedCount = ids.length - unlocatedCount;
      // EVERY AGGREGATE STATES ITS SET. "3 devices" beside a map is a figure a reader takes for the
      // whole family; what is true is "3 of 5 are on the map, 2 have no position", and the two left
      // out are counted rather than quietly dropped from the denominator.
      show(locatedCountEl, ids.length > 0);
      locatedCountEl.textContent = ids.length === 0 ? ''
        : locatedCount + ' of ' + ids.length + ' on map, ' + unlocatedCount + ' without position';

      // Same rule for the rejects: the count is stated over the events this page was handed, so a
      // reader can tell one bad event in forty from forty in forty.
      show(rejectedEl, rejectedCount > 0);
      show(rejectedDetailEl, rejectedCount > 0);
      rejectedEl.textContent = rejectedCount === 0 ? ''
        : rejectedCount + ' of ' + receivedCount + ' updates unreadable';
      rejectedDetailEl.textContent = rejectedCount === 0 ? '' : 'latest: ' + lastRejection;

      renderPanelState(ids.length);
    }

    // reject drops ONE event and says so. It never blanks the map, never removes a device, and never
    // stops the stream: an event this page cannot account for is one event lost, not a session lost.
    // Reasons stay to a few words - the explanation of each lives in the linked document.
    function reject(why) {
      rejectedCount++;
      lastRejection = why;
      render();
    }

    function markInterrupted(why) {
      interrupted = true;
      interruptedWhy = why;
      setStatus('connection interrupted', 'error');
      render();
    }

    function markHealthy(text) {
      interrupted = false;
      interruptedWhy = '';
      setStatus(text, 'live');
      render();
    }

    function fail(reason, action) {
      failure = reason;
      failureAction = action;
    }

    function clearFailure() {
      failure = '';
      failureAction = '';
    }

    function ensureDevice(id, name) {
      if (!devices[id]) {
        devices[id] = { id: id, name: name || id, state: 'no-position', located: false, note: '' };
      } else if (name) {
        devices[id].name = name;
      }
      return devices[id];
    }

    function removeMarker(id) {
      if (markers[id]) {
        map.removeLayer(markers[id]);
        delete markers[id];
      }
    }

    function placeMarker(d, lat, lon) {
      if (markers[d.id]) {
        markers[d.id].setLatLng([lat, lon]).setTooltipContent(label(d));
      } else {
        markers[d.id] = L.circleMarker([lat, lon], {
          radius: 8, color: '#1d6fe0', fillColor: '#1d6fe0', fillOpacity: 0.85, weight: 2
        }).addTo(map).bindTooltip(label(d), { permanent: true, direction: 'right' });
      }
      if (!fitted) {
        map.setView([lat, lon], 15);
        fitted = true;
      }
    }

    function isFiniteNumber(v) {
      return typeof v === 'number' && isFinite(v);
    }

    // onStreamEvent is THE routing point for every event this page consumes. The real EventSource
    // listeners below do nothing but hand it (type, data), which is what makes a hand-written event
    // delivered through window.trackerMap.onStreamEvent equivalent to one that arrived over the wire -
    // there is no second path an injected event could take.
    function onStreamEvent(type, data) {
      // The `error` event: the server has told us it can no longer read the data behind this stream.
      // The connection may well still be open, so this is NOT a drop - and it is exactly the case
      // where a map must stop implying that what it is showing is current.
      if (type === 'error') {
        var why = 'the server cannot read this family';
        try {
          var e = JSON.parse(data);
          if (e && typeof e.message === 'string' && e.message) { why = e.message; }
        } catch (ignored) { /* an error event we cannot parse is still an error event. */ }
        markInterrupted(why);
        return;
      }

      receivedCount++;

      if (type !== 'position' && type !== 'presentation') {
        reject('unknown event type');
        return;
      }

      var p;
      try { p = JSON.parse(data); } catch (err) { reject('unreadable event data'); return; }
      if (!p || typeof p !== 'object' || typeof p.device_id !== 'string' || !p.device_id) {
        reject('event names no device');
        return;
      }
      if (STATE_TOKENS.indexOf(p.presentation) < 0) {
        reject('unknown state word');
        return;
      }

      var d = ensureDevice(p.device_id, p.device_name);
      describedByStream[p.device_id] = true;

      if (type === 'position') {
        // A position event places or moves this device's marker and renders its state.
        if (!isFiniteNumber(p.lat) || !isFiniteNumber(p.lon)) {
          // PRESENT BUT UNLOCATED, never located at a fabricated coordinate. The device keeps its
          // place in the list and says why it is not on the map; the event still costs itself.
          d.state = p.presentation;
          d.located = false;
          d.note = '- position not readable';
          removeMarker(p.device_id);
          reject('coordinate not readable');
          return;
        }
        d.state = p.presentation;
        d.located = true;
        d.note = '';
        placeMarker(d, p.lat, p.lon);
      } else if (p.presentation === 'no-position') {
        // An UNLOCATED presentation payload: the server no longer holds a position for this device
        // (retention purging deleted its last fix). Its marker must go - a no-position device gets no
        // marker at ANY coordinate, and no marker may survive at coordinates the server has dropped.
        d.state = 'no-position';
        d.located = false;
        d.note = '';
        removeMarker(p.device_id);
      } else {
        // A LOCATED presentation payload: the device has not moved, only its freshness changed.
        // Update its state IN PLACE - do not move its marker, do not remove it, do not treat this as
        // a new fix. Scoped to a device that still has a position; one we have never been given a
        // position for simply has no marker to leave alone.
        d.state = p.presentation;
      }

      // Data arrived, so the server can read this family again: the interruption is over.
      if (interrupted) {
        markHealthy('live');
      } else {
        setStatus('live', 'live');
        render();
      }
    }

    // applyPositions is the GET /v1/positions branch. Its job is the DEVICE SET - which devices exist,
    // so an empty family is sayable - and the state of any device the stream has not described yet.
    // For a device the stream HAS described it contributes nothing else: the stream wins, however late
    // this response lands.
    function applyPositions(entries) {
      if (typeof entries === 'string') {
        try {
          entries = JSON.parse(entries);
        } catch (err) {
          receivedCount++;
          reject('unreadable positions reply');
          return;
        }
      }
      if (!entries || Object.prototype.toString.call(entries) !== '[object Array]') {
        receivedCount++;
        reject('positions reply is not a list');
        return;
      }
      deviceSetKnown = true;

      for (var i = 0; i < entries.length; i++) {
        var e = entries[i];
        receivedCount++;
        if (!e || typeof e.device_id !== 'string' || !e.device_id) {
          reject('a positions row names no device');
          continue;
        }
        if (STATE_TOKENS.indexOf(e.presentation) < 0) {
          reject('unknown state word');
          continue;
        }
        var d = ensureDevice(e.device_id, e.device_name);
        if (describedByStream[e.device_id]) {
          continue; // the stream owns this device's state; the response only proves it exists.
        }
        if (e.presentation === 'no-position') {
          d.state = 'no-position';
          d.located = false;
          d.note = '';
          removeMarker(e.device_id);
        } else if (isFiniteNumber(e.lat) && isFiniteNumber(e.lon)) {
          d.state = e.presentation;
          d.located = true;
          d.note = '';
          placeMarker(d, e.lat, e.lon);
        } else {
          // A row the server could not give a coordinate for: present, unlocated, and counted as a
          // row this view left off the map rather than dropped from the set.
          d.state = e.presentation;
          d.located = false;
          d.note = '- position not readable';
        }
      }
      render();
    }

    // A token may also arrive in the URL (?token=...), so a bookmarked link opens straight into the
    // map. It is deliberately NOT persisted anywhere else - the token is a live read credential.
    var urlToken = new URLSearchParams(location.search).get('token');
    if (urlToken) { tokenEl.value = urlToken; }

    function reset() {
      if (source) { source.close(); source = null; }
      for (var id in markers) { map.removeLayer(markers[id]); }
      devices = {};
      markers = {};
      describedByStream = {};
      everOpened = false;
      interrupted = false;
      interruptedWhy = '';
      receivedCount = 0;
      rejectedCount = 0;
      lastRejection = '';
      deviceSetKnown = false;
      fitted = false;
      clearFailure();
    }

    // refused ends the attempt. It does NOT leave an EventSource retrying in the background, because
    // an indefinite retry displayed as "connecting" is a lie: the credential is the problem and no
    // amount of waiting fixes it.
    function refused(detail) {
      if (source) { source.close(); source = null; }
      setStatus(MSG_REFUSED + (detail ? ' (' + detail + ')' : ''), 'error');
      fail(MSG_REFUSED, 'Check the token, then choose Watch');
      render();
    }

    function unreachable(detail) {
      setStatus('could not reach the server', 'error');
      fail('Could not reach the server', detail || 'Check the server, then choose Watch');
      render();
    }

    function watch() {
      var tok = tokenEl.value.trim();
      reset();
      watching = true;
      if (!tok) {
        refused('no token given');
        return;
      }

      setStatus('connecting', 'idle');
      render();

      // The device set, and the credential check. A 401 here is the ONLY reliable way this page can
      // tell "the server refuses this token" from "the network is down": EventSource reports every
      // failure the same way and then retries forever, so a refused credential would otherwise sit
      // there reading "connecting".
      fetch('/v1/positions', { headers: { 'Authorization': 'Bearer ' + tok } })
        .then(function (resp) {
          if (resp.status === 401 || resp.status === 403) {
            refused('HTTP ' + resp.status);
            return null;
          }
          if (!resp.ok) {
            unreachable('The server refused to list devices');
            return null;
          }
          return resp.json();
        })
        .then(function (entries) {
          if (entries === null || entries === undefined) { return; }
          applyPositions(entries);
        })
        .catch(function () {
          unreachable('Check the server, then choose Watch');
        });

      // The token travels in the query string because EventSource cannot set an Authorization header.
      // It must go over TLS in a real deployment (roadmap S7); this is the interim viewer.
      var es = new EventSource('/v1/stream?token=' + encodeURIComponent(tok));
      source = es;

      // current() is what keeps a connection this page has DELIBERATELY abandoned - because the
      // credential was refused, or because Watch was pressed again - from writing over the state that
      // replaced it. A closed EventSource can still have one queued event in flight.
      function current() { return source === es; }

      es.addEventListener('open', function () {
        if (!current()) { return; }
        everOpened = true;
        markHealthy('live');
      });

      es.addEventListener('position', function (e) { if (current()) { onStreamEvent('position', e.data); } });
      es.addEventListener('presentation', function (e) { if (current()) { onStreamEvent('presentation', e.data); } });

      // One listener, two very different events. A named `error` event from the SERVER arrives as a
      // MessageEvent carrying data; a TRANSPORT failure (dropped, or never opened) arrives as a bare
      // Event with none. Both mean the same thing to a viewer - what you are looking at is no longer
      // confirmed - and both must say so rather than freeze a green map.
      es.addEventListener('error', function (e) {
        if (!current()) { return; }
        if (e && typeof e.data === 'string') {
          onStreamEvent('error', e.data);
          return;
        }
        markInterrupted(everOpened
          ? 'the live connection dropped'
          : 'the live connection could not open');
      });
    }

    watchEl.addEventListener('click', watch);
    tokenEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { watch(); } });
    if (urlToken) { watch(); }

    // The verification hook (MAP-VERIFICATION.md, and now cmd/uiverify).
    //
    // The rejection branches need input the production server has no path to emit - an unparseable
    // body, an event type outside the three, a presentation token outside the four - and the
    // last-known branch needs a severed feed. Those inputs are constructed BY THE VERIFIER and handed
    // to exactly the function a wire event goes through, so what is observed is the real routing
    // rather than a second, test-only one. Nothing here reaches the server or changes what it may
    // send.
    window.trackerMap = {
      onStreamEvent: onStreamEvent,
      applyPositions: applyPositions,
      stateTokens: STATE_TOKENS,
      stateText: STATE_TEXT,
      snapshot: function () {
        var ids = Object.keys(devices);
        var located = 0;
        for (var i = 0; i < ids.length; i++) { if (devices[ids[i]].located) { located++; } }
        return {
          devices: JSON.parse(JSON.stringify(devices)),
          markerIds: Object.keys(markers),
          interrupted: interrupted,
          interruptedWhy: interruptedWhy,
          receivedCount: receivedCount,
          rejectedCount: rejectedCount,
          lastRejection: lastRejection,
          deviceSetKnown: deviceSetKnown,
          deviceCount: ids.length,
          locatedCount: located,
          panelState: panelStateEl.getAttribute('data-state'),
          panelStateText: panelStateEl.textContent,
          status: statusEl.textContent,
          statusHealth: statusEl.getAttribute('data-health')
        };
      }
    };
  </script>
</body>
</html>
