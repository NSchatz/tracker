<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tracker - live map</title>

  <!-- Leaflet is VENDORED and served by tracker itself (/static), never a third-party CDN. For a
       self-hosted privacy product that matters: loading the map's script from someone else's server
       would tell them who is watching the family's location. The one thing still fetched from a third
       party is the map TILES (OpenStreetMap, below) - device markers render and move with or without
       them, and the in-app map (roadmap C5) removes even that. This page is the interim viewer. -->
  <link rel="stylesheet" href="/static/leaflet.css">
  <script src="/static/leaflet.js"></script>

  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; }
    #bar {
      display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;
      padding: .5rem .75rem; border-bottom: 1px solid #8884;
    }
    #bar strong { font-size: 1rem; }
    #token { flex: 1 1 16rem; min-width: 8rem; padding: .35rem .5rem; font: inherit; }
    #watch { padding: .35rem .8rem; font: inherit; cursor: pointer; }
    #status { color: #888; }
    #status.live { color: #16794b; }
    #status.error { color: #b00020; }
    #rejected { color: #8a6d00; }
    #rejected:empty { display: none; }
    #body { display: flex; height: calc(100% - 3rem); }
    #panel { width: 20rem; max-width: 45%; overflow: auto; border-right: 1px solid #8884; padding: .5rem .75rem; }
    #panel h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: #888; margin: .75rem 0 .25rem; }
    #panel ul { list-style: none; margin: 0; padding: 0; }
    #panel li { padding: .2rem 0; border-bottom: 1px solid #8882; }
    #panel li .state { font-weight: 600; }
    #panel li .unconfirmed { color: #b00020; }
    #empty:empty { display: none; }
    #map { flex: 1 1 auto; }
    @media (prefers-color-scheme: dark) { #status.live { color: #5ad19a; } }
  </style>
</head>
<body>
  <div id="bar">
    <strong>tracker</strong>
    <input id="token" type="password" placeholder="viewer token" autocomplete="off" spellcheck="false">
    <button id="watch">Watch</button>
    <span id="status">enter a viewer token to watch your family's map</span>
    <span id="rejected"></span>
  </div>
  <div id="body">
    <div id="panel">
      <h2>Devices</h2>
      <p id="empty"></p>
      <ul id="located"></ul>
      <h2 id="unlocated-heading" hidden>Present, not located</h2>
      <ul id="unlocated"></ul>
    </div>
    <div id="map"></div>
  </div>

  <script>
    // A live family map with no build step.
    //
    // THE ONE RULE THIS PAGE OBEYS: the SERVER decides what a device's state is, and this page renders
    // exactly the token it was sent. There is no clock arithmetic here and there must never be one - a
    // browser whose clock is hours off (or a laptop resuming from sleep) would otherwise disagree with
    // the server about whether a phone is live, and the whole point of a server-computed presentation
    // value is that every surface says the same thing.
    //
    // Two server-sent sources describe a device: GET /v1/positions (which tells us the DEVICE SET is
    // complete, so "no devices in this family" is distinguishable from "still connecting") and the SSE
    // stream. THE STREAM WINS: once the stream has described a device, a positions response that lands
    // later contributes nothing but the device's existence, so a slow response can never revert a
    // repaint the stream already made.
    //
    // Connection health is a SEPARATE AXIS from device state. A broken stream never turns a family
    // green and never freezes the last states as though they were current: the page keeps the exact
    // token the server last sent for each device and ANNOTATES it as unconfirmed, alongside a
    // page-level interruption notice. No device is then presented as CURRENTLY live.

    // The complete presentation vocabulary, exactly as the wire spells it (SPEC.md). Anything else
    // arriving under a `presentation` key is an event this page refuses rather than renders.
    var STATE_TOKENS = ['no-position', 'live', 'recent', 'stale'];

    // The two strings a reader must be able to tell apart from "still connecting".
    var MSG_NO_DEVICES = 'no devices in this family';
    var MSG_REFUSED = 'viewer token refused: the server would not accept this credential';

    var map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var statusEl = document.getElementById('status');
    var rejectedEl = document.getElementById('rejected');
    var emptyEl = document.getElementById('empty');
    var locatedEl = document.getElementById('located');
    var unlocatedEl = document.getElementById('unlocated');
    var unlocatedHeadingEl = document.getElementById('unlocated-heading');
    var tokenEl = document.getElementById('token');
    var watchEl = document.getElementById('watch');

    var devices = {};           // device_id -> {id, name, state, located}
    var markers = {};           // device_id -> Leaflet marker (located devices only)
    var describedByStream = {}; // device_id -> true, once the stream has described it
    var source = null;          // the current EventSource
    var everOpened = false;     // has this connection ever been established?
    var interrupted = false;    // connection health, NOT device state
    var interruptedWhy = '';
    var rejectedCount = 0;
    var lastRejection = '';
    var deviceSetKnown = false; // has GET /v1/positions told us the set is complete?
    var fitted = false;         // have we auto-framed the first located device yet?

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || '';
    }

    // label is what a viewer READS for a device. The state token is always in it, in words, so the
    // four stay distinguishable when colour perception is removed - and the unconfirmed annotation is
    // added BESIDE the token, never in place of it.
    function label(d) {
      var text = d.name + ' - ' + d.state;
      if (interrupted) { text += ' (unconfirmed)'; }
      return text;
    }

    function render() {
      var ids = Object.keys(devices).sort(function (a, b) {
        var an = devices[a].name.toLowerCase(), bn = devices[b].name.toLowerCase();
        if (an !== bn) { return an < bn ? -1 : 1; }
        return a < b ? -1 : 1;
      });

      locatedEl.textContent = '';
      unlocatedEl.textContent = '';
      var unlocatedCount = 0;

      for (var i = 0; i < ids.length; i++) {
        var d = devices[ids[i]];
        var li = document.createElement('li');
        li.setAttribute('data-device-id', d.id);
        li.setAttribute('data-state', d.state);
        li.appendChild(document.createTextNode(d.name + ' '));
        var span = document.createElement('span');
        span.className = 'state';
        span.textContent = d.state;
        li.appendChild(span);
        if (interrupted) {
          var mark = document.createElement('span');
          mark.className = 'unconfirmed';
          mark.textContent = ' (unconfirmed)';
          li.appendChild(mark);
        }
        if (d.located) {
          locatedEl.appendChild(li);
          if (markers[d.id]) { markers[d.id].setTooltipContent(label(d)); }
        } else {
          unlocatedEl.appendChild(li);
          unlocatedCount++;
        }
      }
      unlocatedHeadingEl.hidden = unlocatedCount === 0;

      // "No devices" is only sayable once GET /v1/positions has answered: the stream fixes exactly
      // three event types and none of them marks the snapshot complete, so an empty map before that
      // response means "still connecting", which is a different thing and must not be claimed.
      emptyEl.textContent = (deviceSetKnown && ids.length === 0) ? MSG_NO_DEVICES : '';

      rejectedEl.textContent = rejectedCount === 0 ? ''
        : rejectedCount + ' event(s) rejected: ' + lastRejection;
    }

    // reject drops ONE event and says so. It never blanks the map, never removes a device, and never
    // stops the stream: an event this page cannot account for is one event lost, not a session lost.
    function reject(why) {
      rejectedCount++;
      lastRejection = why;
      render();
    }

    function markInterrupted(why) {
      interrupted = true;
      interruptedWhy = why;
      setStatus('connection interrupted: ' + why + '. Device states below are no longer confirmed.', 'error');
      render();
    }

    function markHealthy(text) {
      interrupted = false;
      interruptedWhy = '';
      setStatus(text, 'live');
      render();
    }

    function ensureDevice(id, name) {
      if (!devices[id]) {
        devices[id] = { id: id, name: name || id, state: 'no-position', located: false };
      } else if (name) {
        devices[id].name = name;
      }
      return devices[id];
    }

    function removeMarker(id) {
      if (markers[id]) {
        map.removeLayer(markers[id]);
        delete markers[id];
      }
    }

    function placeMarker(d, lat, lon) {
      if (markers[d.id]) {
        markers[d.id].setLatLng([lat, lon]).setTooltipContent(label(d));
      } else {
        markers[d.id] = L.circleMarker([lat, lon], {
          radius: 8, color: '#1d6fe0', fillColor: '#1d6fe0', fillOpacity: 0.85, weight: 2
        }).addTo(map).bindTooltip(label(d), { permanent: true, direction: 'right' });
      }
      if (!fitted) {
        map.setView([lat, lon], 15);
        fitted = true;
      }
    }

    function isFiniteNumber(v) {
      return typeof v === 'number' && isFinite(v);
    }

    // onStreamEvent is THE routing point for every event this page consumes. The real EventSource
    // listeners below do nothing but hand it (type, data), which is what makes a hand-written event
    // delivered through window.trackerMap.onStreamEvent equivalent to one that arrived over the wire -
    // there is no second path an injected event could take.
    function onStreamEvent(type, data) {
      // The `error` event: the server has told us it can no longer read the data behind this stream.
      // The connection may well still be open, so this is NOT a drop - and it is exactly the case
      // where a map must stop implying that what it is showing is current.
      if (type === 'error') {
        var why = 'the server reported it cannot read this family\'s data';
        try {
          var e = JSON.parse(data);
          if (e && typeof e.message === 'string' && e.message) { why = e.message; }
        } catch (ignored) { /* an error event we cannot parse is still an error event. */ }
        markInterrupted(why);
        return;
      }

      if (type !== 'position' && type !== 'presentation') {
        reject('unrecognised event type "' + type + '"');
        return;
      }

      var p;
      try { p = JSON.parse(data); } catch (err) { reject('unparseable event data'); return; }
      if (!p || typeof p !== 'object' || typeof p.device_id !== 'string' || !p.device_id) {
        reject('event names no device');
        return;
      }
      if (STATE_TOKENS.indexOf(p.presentation) < 0) {
        reject('presentation value "' + String(p.presentation) + '" is outside the four tokens');
        return;
      }

      var d = ensureDevice(p.device_id, p.device_name);
      describedByStream[p.device_id] = true;

      if (type === 'position') {
        // A position event places or moves this device's marker and renders its state.
        if (!isFiniteNumber(p.lat) || !isFiniteNumber(p.lon)) {
          reject('position event for ' + d.name + ' carries no usable coordinate');
          return;
        }
        d.state = p.presentation;
        d.located = true;
        placeMarker(d, p.lat, p.lon);
      } else if (p.presentation === 'no-position') {
        // An UNLOCATED presentation payload: the server no longer holds a position for this device
        // (retention purging deleted its last fix). Its marker must go - a no-position device gets no
        // marker at ANY coordinate, and no marker may survive at coordinates the server has dropped.
        d.state = 'no-position';
        d.located = false;
        removeMarker(p.device_id);
      } else {
        // A LOCATED presentation payload: the device has not moved, only its freshness changed.
        // Update its state IN PLACE - do not move its marker, do not remove it, do not treat this as
        // a new fix. Scoped to a device that still has a position; one we have never been given a
        // position for simply has no marker to leave alone.
        d.state = p.presentation;
      }

      // Data arrived, so the server can read this family again: the interruption is over.
      if (interrupted) {
        markHealthy('live');
      } else {
        setStatus('live', 'live');
        render();
      }
    }

    // applyPositions is the GET /v1/positions branch. Its job is the DEVICE SET - which devices exist,
    // so an empty family is sayable - and the state of any device the stream has not described yet.
    // For a device the stream HAS described it contributes nothing else: the stream wins, however late
    // this response lands.
    function applyPositions(entries) {
      if (typeof entries === 'string') {
        try { entries = JSON.parse(entries); } catch (err) { reject('unparseable positions response'); return; }
      }
      if (!entries || Object.prototype.toString.call(entries) !== '[object Array]') {
        reject('positions response is not a JSON array');
        return;
      }
      deviceSetKnown = true;

      for (var i = 0; i < entries.length; i++) {
        var e = entries[i];
        if (!e || typeof e.device_id !== 'string' || !e.device_id) {
          reject('a positions entry names no device');
          continue;
        }
        if (STATE_TOKENS.indexOf(e.presentation) < 0) {
          reject('positions entry for ' + e.device_id + ' carries a presentation value outside the four tokens');
          continue;
        }
        var d = ensureDevice(e.device_id, e.device_name);
        if (describedByStream[e.device_id]) {
          continue; // the stream owns this device's state; the response only proves it exists.
        }
        if (e.presentation === 'no-position') {
          d.state = 'no-position';
          d.located = false;
          removeMarker(e.device_id);
        } else if (isFiniteNumber(e.lat) && isFiniteNumber(e.lon)) {
          d.state = e.presentation;
          d.located = true;
          placeMarker(d, e.lat, e.lon);
        } else {
          d.state = e.presentation;
        }
      }
      render();
    }

    // A token may also arrive in the URL (?token=...), so a bookmarked link opens straight into the
    // map. It is deliberately NOT persisted anywhere else - the token is a live read credential.
    var urlToken = new URLSearchParams(location.search).get('token');
    if (urlToken) { tokenEl.value = urlToken; }

    function reset() {
      if (source) { source.close(); source = null; }
      for (var id in markers) { map.removeLayer(markers[id]); }
      devices = {};
      markers = {};
      describedByStream = {};
      everOpened = false;
      interrupted = false;
      interruptedWhy = '';
      rejectedCount = 0;
      lastRejection = '';
      deviceSetKnown = false;
      fitted = false;
      render();
    }

    // refused ends the attempt. It does NOT leave an EventSource retrying in the background, because
    // an indefinite retry displayed as "connecting" is a lie: the credential is the problem and no
    // amount of waiting fixes it.
    function refused(detail) {
      if (source) { source.close(); source = null; }
      setStatus(MSG_REFUSED + (detail ? ' (' + detail + ')' : ''), 'error');
      render();
    }

    function watch() {
      var tok = tokenEl.value.trim();
      reset();
      if (!tok) {
        refused('no viewer token was given');
        return;
      }

      setStatus('connecting...');

      // The device set, and the credential check. A 401 here is the ONLY reliable way this page can
      // tell "the server refuses this token" from "the network is down": EventSource reports every
      // failure the same way and then retries forever, so a refused credential would otherwise sit
      // there reading "connecting".
      fetch('/v1/positions', { headers: { 'Authorization': 'Bearer ' + tok } })
        .then(function (resp) {
          if (resp.status === 401 || resp.status === 403) {
            refused('HTTP ' + resp.status);
            return null;
          }
          if (!resp.ok) {
            setStatus('the server could not list this family\'s devices (HTTP ' + resp.status + ')', 'error');
            return null;
          }
          return resp.json();
        })
        .then(function (entries) {
          if (entries === null || entries === undefined) { return; }
          applyPositions(entries);
        })
        .catch(function (err) {
          setStatus('could not reach the server to list devices: ' + err, 'error');
        });

      // The token travels in the query string because EventSource cannot set an Authorization header.
      // It must go over TLS in a real deployment (roadmap S7); this is the interim viewer.
      var es = new EventSource('/v1/stream?token=' + encodeURIComponent(tok));
      source = es;

      // current() is what keeps a connection this page has DELIBERATELY abandoned - because the
      // credential was refused, or because Watch was pressed again - from writing over the state that
      // replaced it. A closed EventSource can still have one queued event in flight.
      function current() { return source === es; }

      es.addEventListener('open', function () {
        if (!current()) { return; }
        everOpened = true;
        markHealthy('live');
      });

      es.addEventListener('position', function (e) { if (current()) { onStreamEvent('position', e.data); } });
      es.addEventListener('presentation', function (e) { if (current()) { onStreamEvent('presentation', e.data); } });

      // One listener, two very different events. A named `error` event from the SERVER arrives as a
      // MessageEvent carrying data; a TRANSPORT failure (dropped, or never opened) arrives as a bare
      // Event with none. Both mean the same thing to a viewer - what you are looking at is no longer
      // confirmed - and both must say so rather than freeze a green map.
      es.addEventListener('error', function (e) {
        if (!current()) { return; }
        if (e && typeof e.data === 'string') {
          onStreamEvent('error', e.data);
          return;
        }
        markInterrupted(everOpened
          ? 'the live connection dropped; reconnecting'
          : 'the live connection could not be opened');
      });
    }

    watchEl.addEventListener('click', watch);
    tokenEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { watch(); } });
    if (urlToken) { watch(); }

    // The verification hook (MAP-VERIFICATION.md).
    //
    // AC28's rejection branches need input the production server has no path to emit - an unparseable
    // body, an event type outside the three, a presentation token outside the four - and AC26 needs
    // the same device described twice. Those inputs are constructed BY THE VERIFIER and handed to
    // exactly the function a wire event goes through, so what is observed is the real routing rather
    // than a second, test-only one. Nothing here reaches the server or changes what it may send.
    window.trackerMap = {
      onStreamEvent: onStreamEvent,
      applyPositions: applyPositions,
      stateTokens: STATE_TOKENS,
      snapshot: function () {
        return {
          devices: JSON.parse(JSON.stringify(devices)),
          markerIds: Object.keys(markers),
          interrupted: interrupted,
          interruptedWhy: interruptedWhy,
          rejectedCount: rejectedCount,
          lastRejection: lastRejection,
          deviceSetKnown: deviceSetKnown,
          status: statusEl.textContent
        };
      }
    };
  </script>
</body>
</html>
