name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned for reproducibility. staticcheck/govulncheck are deliberately NOT pinned here:
  # the gate below is `make check`, so the Makefile owns those versions. Pinning them in
  # both places is how a Makefile bump leaves CI silently running a different tool than a
  # human does.
  #
  # The Go toolchain is the one version that MUST be restated — here, as the Dockerfile's
  # builder image, and as go.mod's `toolchain` directive — because CI, the shipped image and
  # a developer's `go build` are three different builds. internal/toolchain asserts they
  # agree, inside `make check`, so a half-landed bump fails loudly instead of leaving CI to
  # prove things with a compiler production never runs.
  GO_VERSION: "1.26.8"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a COMMIT SHA with the human-readable version in a
      # trailing comment (pinning conventions P3). A `v4` tag is mutable and is moved by
      # its publisher, which is a supply-chain path straight into this build: both
      # actions/checkout@v4 and actions/setup-java@v4 had already moved under this
      # workflow before these SHAs were written down. Provenance and the command that
      # re-resolves each one are in README.md, "Pinned references".
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      # The Android half of `make check` needs a JDK 17 (AGP 8.5 requires it) and an
      # Android SDK. These steps only PROVISION the toolchain — exactly as setup-go does for
      # the Go half. The version pins (AGP, Kotlin, SDK levels, Gradle via the committed
      # wrapper) live in the repo's build files, never here, so CI cannot drift from the
      # gate a human runs. setup-android installs cmdline-tools and accepts licenses;
      # Gradle/AGP then fetch platforms;android-34 + build-tools;34.0.0 on demand.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      # THE gate — the same target a human runs and the same one scripts/verify.sh runs.
      # It is now BOTH stacks: the Go server and the Android client.
      #
      # `make test` inside it starts a REAL PostGIS via testcontainers (ubuntu-latest ships
      # a Docker daemon, so this works unmodified). Those tests FAIL rather than skip if
      # the daemon is unreachable: tracker's correctness is spatial SQL, which cannot be
      # proven against a mock, and a gate that skips its bedrock when the database is
      # missing reports green while proving nothing.
      - name: make check
        run: make check

  ui:
    # The USER-INTERFACE gate, and it is a separate job because it needs prerequisites `make check`
    # does not: a browser engine and a booted Android emulator.
    #
    # tracker ships two user interfaces, and the umbrella's frontend conventions bind both. F2 of
    # those conventions admits exactly one grader for a claim about what a person SEES — the runtime
    # that draws it — so these four targets drive Chromium over the served map and an emulator over
    # the app's one screen. All four REFUSE LOUDLY rather than skipping when their prerequisite is
    # missing, which is why a runner that lost its browser or its /dev/kvm turns this job red
    # instead of quietly grading nothing.
    #
    # As everywhere else in this repo, the version pins live in the build files, never here: the AVD
    # name and the system image are Makefile variables, the Android tool versions are in
    # android/gradle/libs.versions.toml, and Chromium is whatever the runner image ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      # The map's rendered claims, in a real browser engine. The runner image ships Google Chrome;
      # cmd/uiverify finds it on PATH and exits non-zero naming it if it ever stops being there.
      - name: make verify-ui (the browser map)
        run: make verify-ui

      # Hardware acceleration for the emulator. Without /dev/kvm an x86_64 Android image does not
      # boot at all — it segfaults under QEMU's interpreter — so this is a prerequisite, not a
      # speed-up, and `scripts/android-emulator.sh` says so by name when it is absent.
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ANDROID_AVD_HOME is pinned for the whole job so the step that CREATES the AVD and the script
      # that looks for it cannot disagree about where it lives - avdmanager's default has moved
      # across cmdline-tools releases, and a mismatch reads as "no emulator", which is the one thing
      # this route must never say when there is one.
      - name: provision the emulator
        env:
          ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          image="$(make -s print-sys-image)"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "emulator" "$image"
          echo no | avdmanager create avd -n "$(make -s print-avd)" -k "$image" -d pixel_5 --force
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          ls -la "$ANDROID_AVD_HOME"

      # The Android screen's rendered claims, on that emulator, with the platform accessibility
      # checks enabled over every rendered view.
      - name: make verify-ui-android (the Android screen)
        run: make verify-ui-android

      # Both routes, with their prerequisite removed, must exit non-zero naming what is missing.
      # This is the check that keeps the two above from ever degrading into a silent skip.
      #
      # `if: success() || failure()` because a step that only ever runs after a green emulator route
      # is a step that never runs on the day it matters: while the route above was red these two
      # reported `skipped` on every run of the branch, so AC24's "execute ... the refusal check and
      # the record check" was not being met by a workflow that looked as though it did. A cancelled
      # run still skips them.
      - name: make verify-ui-refusal (the refusal paths still bite)
        if: success() || failure()
        run: make verify-ui-refusal

      # The committed F1-F11 record, checked against what the two routes ACTUALLY ran above. It runs
      # last for that reason: it refuses a record naming an assertion nobody executed - which is
      # exactly the answer worth having after a route went red.
      - name: make verify-ui-record (the clause record)
        if: success() || failure()
        run: make verify-ui-record

      - name: upload the UI grading evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-grading-evidence
          path: |
            build/uiverify/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn

  smoke:
    # The deploy gate. `make check` proves the code is correct; this proves the SHIPPED
    # ARTEFACT works — that the image builds, the binary finds its database, and the
    # embedded migrations run. A green build has never implied a working deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: compose smoke (/healthz against the real stack)
        run: make smoke
